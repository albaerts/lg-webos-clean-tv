# lean.sh switches. 1 = off (feature disabled at every boot), 0 = leave LG's default. Reversible: sh lean.sh --restore
VOICE_OFF=1        # built-in wake-word microphone + remote microphone + voice assistant (the mic button stops working)
THINQ_OFF=1        # LG ThinQ / IoT cloud link, Matter client, zigbee hub (ThinQ app remote control stops working)
TELEMETRY_OFF=1    # LG analytics (sdx), log upload (uploadd), account/recommendation nudges, fitness/wearable services, Alexa trigger
CAST_OFF=0         # Google Cast provisioning (set to 1 after delete-bloat.sh --cast)
