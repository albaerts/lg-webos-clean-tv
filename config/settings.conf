# settings.sh switches (LG's own settings service; change back any time in the TV menu)
LIVEPLUS_OFF=1          # Live Plus = ACR content recognition (what you watch is reported)
VOICE_FARFIELD_OFF=1    # far-field "wake word" microphone setting
ALWAYS_READY_OFF=1      # Always Ready: pressing power shows art instead of switching off
SCREENSAVER_OFF=0       # 1 switches LG's screen saver off. OLED burn-in protection - only if you know what you do
